  # POSTGRES (New DB for .NET User.Auth)
  postgres:
    image: postgres:15-alpine
    container_name: nestwise-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: nestwise_user
      POSTGRES_PASSWORD: nestwise_password
      POSTGRES_DB: NestWiseDb
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - default

    # .NET USER AUTH SERVICE
  nestwise-backend-userauth-dotnet:
    build:
      context: ./User.Auth
      dockerfile: Dockerfile.dev
    container_name: userauth-dotnet
    ports:
      - "7001:7001"
    volumes:
      - ./User.Auth:/app
      - /app/src/User.Auth.Api/bin
      - /app/src/User.Auth.Api/obj
      - /app/src/User.Auth.Core/bin
      - /app/src/User.Auth.Core/obj
      - /app/src/User.Auth.Infrastructure/bin
      - /app/src/User.Auth.Infrastructure/obj
    env_file:
      - .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:7001
    command: dotnet watch --project src/User.Auth.Api/User.Auth.Api.csproj run
    depends_on:
      - postgres
    networks:
      - default

networks:
  default:
    driver: bridge

volumes:
  ingest_pgdata:
  postgres_data:
