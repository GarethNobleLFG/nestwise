name: nestwise

services:
  # FRONTEND (React)
  nestwise-frontend:
    build: ./frontend
    container_name: nestwise-frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - HOST=0.0.0.0
      - PORT=3000
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
      - BROWSER=none
      - FAST_REFRESH=true
      - WDS_SOCKET_HOST=localhost 
      - WDS_SOCKET_PORT=0  
    restart: unless-stopped
    volumes:
      - ./frontend:/app
      - /app/node_modules
    env_file: ./.env
    command: npm start
    networks:
      - default

  # BACKEND LANGGRAPH
  nestwise-backend-langgraph:
    build: ./backend-langgraph
    container_name: langgraph-backend
    ports:
      - "8000:8000"
    env_file:
      - ./.env
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    volumes:
      - ./backend-langgraph:/app
    command: uvicorn app:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      - mongo
    networks:
      - default

  # MONGO (Existing DB)
  mongo:
    image: mongo:6.0
    container_name: nestwise-mongo
    restart: unless-stopped
    command: ["mongod", "--config", "/etc/mongod.conf"]
    volumes:
      - ./mongo/mongod.conf:/etc/mongod.conf:ro
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "27017:27017"
    networks:
      - default

